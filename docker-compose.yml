version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: resume_analyzer_db
      MYSQL_USER: analyzer_user
      MYSQL_PASSWORD: ResumePass123!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_HOST: db
      DB_USER: analyzer_user
      DB_PASSWORD: ResumePass123!
      DB_NAME: resume_analyzer_db
      DB_PORT: 3306
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  mysql_data:
